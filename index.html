<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RetouchPDF</title>
    <meta name="description" content="Éditeur PDF gratuit et 100 % privé : modifiez le texte, remplissez des formulaires, signez. Free, private PDF editor that runs in your browser: your files never leave your computer." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82f6'/><path d='M18 7h-7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V12z M18 7v5h5 M13 17h6 M13 21h4' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <script>
      // Apply the saved theme before the first paint (no flash of the wrong theme).
      try {
        const t = localStorage.getItem('pdf-editor-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <!-- Icons (inline so the offline build never loads anything) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-logo" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /><path d="M8 13h8M8 17h5" /></symbol>
        <symbol id="i-open" viewBox="0 0 24 24"><path d="M6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></symbol>
        <symbol id="i-files" viewBox="0 0 24 24"><path d="M15 2H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7z" /><path d="M15 2v5h5" /><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8" /></symbol>
        <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /><path d="M12 18v-6M9 15h6" /></symbol>
        <symbol id="i-file-up" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /><path d="M12 18v-6M9 15l3-3 3 3" /></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="M7 10l5 5 5-5" /><path d="M12 15V3" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6" /><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" /></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 7v6h-6" /><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" /></symbol>
        <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" /></symbol>
        <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3" /><path d="M9 20h6" /><path d="M12 4v16" /></symbol>
        <symbol id="i-draw" viewBox="0 0 24 24"><path d="M3 17c2.5 0 3.5-9 6-9s1.5 9 4.5 9 3-6 5-6 2.5 2 2.5 3" /></symbol>
        <symbol id="i-highlight" viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3" /><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" /></symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21" /><path d="M22 21H7" /><path d="M5 11l9 9" /></symbol>
        <symbol id="i-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="M21 15l-3.09-3.09a2 2 0 0 0-2.82 0L6 21" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></symbol>
        <symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></symbol>
        <symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z" /></symbol>
      </defs>
    </svg>

    <header class="appbar">
      <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-logo" /></svg></div>
        <div class="brand-text">
          <div class="app-name">RetouchPDF</div>
          <div class="doc-name" id="doc-name"></div>
        </div>
      </div>

      <div class="bar-group">
        <button class="ghost" id="btn-open" data-i18n-title="open.title"><svg class="icon"><use href="#i-open" /></svg><span class="label" data-i18n="open"></span></button>
        <button class="ghost" id="btn-insert" data-i18n-title="merge.title" data-needs-doc><svg class="icon"><use href="#i-files" /></svg><span class="label" data-i18n="merge"></span></button>
        <button class="ghost" id="btn-blank" data-i18n-title="blank.title" data-needs-doc><svg class="icon"><use href="#i-file-plus" /></svg><span class="label" data-i18n="blank"></span></button>
      </div>

      <div class="spacer"></div>

      <div class="bar-group">
        <button class="icon-btn" id="btn-undo" data-i18n-title="undo.title" aria-label="" disabled><svg class="icon"><use href="#i-undo" /></svg></button>
        <button class="icon-btn" id="btn-redo" data-i18n-title="redo.title" aria-label="" disabled><svg class="icon"><use href="#i-redo" /></svg></button>
      </div>

      <div class="zoom" data-needs-doc>
        <button class="icon-btn" id="btn-zoom-out" data-i18n-title="zoomOut.title" aria-label=""><svg class="icon"><use href="#i-minus" /></svg></button>
        <span id="zoom-label">125%</span>
        <button class="icon-btn" id="btn-zoom-in" data-i18n-title="zoomIn.title" aria-label=""><svg class="icon"><use href="#i-plus" /></svg></button>
      </div>

      <span class="page-label" id="page-label"></span>

      <a class="support-btn" id="btn-support" target="_blank" rel="noopener" data-i18n-title="support.title"><svg class="icon"><use href="#i-heart" /></svg><span class="label" data-i18n="support"></span></a>
      <button class="icon-btn lang-btn" id="btn-lang" data-i18n-title="lang.title" aria-label=""></button>
      <button class="icon-btn" id="btn-theme" data-i18n-title="theme.title" aria-label="">
        <svg class="icon theme-dark"><use href="#i-moon" /></svg>
        <svg class="icon theme-light"><use href="#i-sun" /></svg>
      </button>

      <button class="primary" id="btn-save" data-i18n-title="save.title" data-needs-doc><svg class="icon"><use href="#i-save" /></svg><span class="label" data-i18n="save"></span></button>
    </header>

    <nav class="toolbar">
      <div class="segmented tools" data-needs-doc>
        <button data-tool="select" data-i18n-title="tool.select.title"><svg class="icon"><use href="#i-pointer" /></svg><span class="label" data-i18n="tool.select"></span></button>
        <button data-tool="edittext" data-i18n-title="tool.edittext.title"><svg class="icon"><use href="#i-edit" /></svg><span class="label" data-i18n="tool.edittext"></span></button>
        <button data-tool="text" data-i18n-title="tool.text.title"><svg class="icon"><use href="#i-type" /></svg><span class="label" data-i18n="tool.text"></span></button>
        <button data-tool="draw" data-i18n-title="tool.draw.title"><svg class="icon"><use href="#i-draw" /></svg><span class="label" data-i18n="tool.draw"></span></button>
        <button data-tool="highlight" data-i18n-title="tool.highlight.title"><svg class="icon"><use href="#i-highlight" /></svg><span class="label" data-i18n="tool.highlight"></span></button>
        <button data-tool="whiteout" data-i18n-title="tool.whiteout.title"><svg class="icon"><use href="#i-eraser" /></svg><span class="label" data-i18n="tool.whiteout"></span></button>
        <button data-tool="rect" data-i18n-title="tool.rect.title"><svg class="icon"><use href="#i-square" /></svg><span class="label" data-i18n="tool.rect"></span></button>
        <button id="btn-image" data-i18n-title="tool.image.title"><svg class="icon"><use href="#i-image" /></svg><span class="label" data-i18n="tool.image"></span></button>
      </div>

      <div class="props" id="props">
        <label class="swatch" id="prop-color" data-i18n-title="prop.color">
          <input type="color" id="in-color" value="#1d4ed8" />
          <span class="swatch-chip"></span>
        </label>
        <label class="field" id="prop-font" data-i18n-title="prop.font">
          <select id="in-font">
            <optgroup data-i18n-label="fonts.standard">
            <option value="Helvetica">Helvetica</option>
            <option value="Helvetica-Bold">Helvetica Bold</option>
            <option value="Helvetica-Oblique">Helvetica Italic</option>
            <option value="Helvetica-BoldOblique">Helvetica Bold Italic</option>
            <option value="Times-Roman">Times</option>
            <option value="Times-Bold">Times Bold</option>
            <option value="Times-Italic">Times Italic</option>
            <option value="Times-BoldItalic">Times Bold Italic</option>
            <option value="Courier">Courier</option>
            <option value="Courier-Bold">Courier Bold</option>
            <option value="Courier-Oblique">Courier Italic</option>
            <option value="Courier-BoldOblique">Courier Bold Italic</option>
            </optgroup>
            <optgroup data-i18n-label="fonts.local" id="font-group-local" hidden></optgroup>
            <optgroup data-i18n-label="fonts.more">
              <option value="__browse__" id="font-browse-option" data-i18n="fonts.browse"></option>
              <option value="__file__" data-i18n="fonts.file"></option>
            </optgroup>
          </select>
        </label>
        <label class="field" id="prop-size" data-i18n-title="prop.size.title"><span data-i18n="prop.size"></span><input type="number" id="in-size" min="4" max="144" value="14" /></label>
        <label class="field" id="prop-stroke" data-i18n-title="prop.line.title"><span data-i18n="prop.line"></span><input type="number" id="in-stroke" min="0.5" max="40" step="0.5" value="2" /></label>
      </div>

      <button class="ghost danger" id="btn-delete" data-i18n-title="delete.title" hidden><svg class="icon"><use href="#i-trash" /></svg><span class="label" data-i18n="delete"></span></button>

      <div class="tool-help" id="hint"><svg class="icon"><use href="#i-info" /></svg><span id="hint-text"></span></div>
    </nav>

    <main>
      <aside id="sidebar"></aside>
      <section id="workspace">
        <div id="empty">
          <div class="empty-card">
            <div class="empty-icon"><svg class="icon"><use href="#i-file-up" /></svg></div>
            <h1 data-i18n="empty.title"></h1>
            <p data-i18n="empty.text"></p>
            <div class="empty-actions">
              <button id="btn-open-2" class="primary large"><svg class="icon"><use href="#i-open" /></svg><span data-i18n="empty.open"></span></button>
              <button id="btn-new" class="large"><svg class="icon"><use href="#i-file-plus" /></svg><span data-i18n="empty.blank"></span></button>
            </div>
            <p class="drop-note" data-i18n="empty.drop"></p>
            <div class="privacy"><svg class="icon"><use href="#i-lock" /></svg><span data-i18n="empty.privacy"></span></div>
          </div>
          <section class="about" aria-labelledby="about-title">
            <h2 id="about-title" data-i18n="about.title"></h2>
            <p data-i18n="about.intro"></p>
            <h3 data-i18n="about.featuresTitle"></h3>
            <ul class="feature-list">
              <li data-i18n="feature.1"></li>
              <li data-i18n="feature.2"></li>
              <li data-i18n="feature.3"></li>
              <li data-i18n="feature.4"></li>
              <li data-i18n="feature.5"></li>
              <li data-i18n="feature.6"></li>
            </ul>
            <h3 data-i18n="about.faqTitle"></h3>
            <section class="faq">
              <div class="faq-item">
                <h4 data-i18n="faq.q1"></h4>
                <p data-i18n="faq.a1"></p>
              </div>
              <div class="faq-item">
                <h4 data-i18n="faq.q2"></h4>
                <p data-i18n="faq.a2"></p>
              </div>
              <div class="faq-item">
                <h4 data-i18n="faq.q3"></h4>
                <p data-i18n="faq.a3"></p>
              </div>
              <div class="faq-item">
                <h4 data-i18n="faq.q4"></h4>
                <p data-i18n="faq.a4"></p>
              </div>
              <div class="faq-item">
                <h4 data-i18n="faq.q5"></h4>
                <p data-i18n="faq.a5"></p>
              </div>
              <div class="faq-item">
                <h4 data-i18n="faq.q6"></h4>
                <p data-i18n="faq.a6"></p>
              </div>
            </section>
          </section>
          <footer class="site-footer">
            <a href="#legal" id="link-legal" data-i18n="footer.legal"></a>
            <a href="#privacy" id="link-privacy" data-i18n="footer.privacy"></a>
            <a id="link-source" target="_blank" rel="noopener" data-i18n="footer.source" hidden></a>
            <a id="link-download" data-i18n="footer.download" hidden></a>
            <a id="link-support" target="_blank" rel="noopener" class="footer-support"><svg class="icon"><use href="#i-heart" /></svg><span data-i18n="support"></span></a>
            <div class="footer-meta">
              <span id="app-version"></span>
              <a id="link-update" target="_blank" rel="noopener" data-i18n="footer.update" hidden></a>
              <a id="link-checksum" href="SHA256SUMS.txt" target="_blank" rel="noopener" data-i18n="footer.checksum" hidden></a>
            </div>
          </footer>
        </div>
        <div id="viewer"></div>
      </section>
    </main>

    <div id="toast" hidden></div>

    <input type="file" id="file-open" accept="application/pdf,.pdf" hidden />
    <input type="file" id="file-insert" accept="application/pdf,.pdf" hidden multiple />
    <input type="file" id="file-image" accept="image/*" hidden />
    <input type="file" id="file-font" accept=".ttf,.otf,.ttc,font/ttf,font/otf,font/collection" hidden />

    <dialog id="font-dialog" class="font-dialog">
      <form method="dialog" class="font-dialog-head">
        <strong data-i18n="fontDialog.title"></strong>
        <button class="icon-btn" value="cancel" data-i18n-title="close" aria-label=""><svg class="icon"><use href="#i-x" /></svg></button>
      </form>
      <input type="search" id="font-search" data-i18n-placeholder="fontDialog.search" autocomplete="off" />
      <div class="font-list" id="font-list"></div>
    </dialog>

    <dialog id="info-dialog" class="info-dialog">
      <form method="dialog" class="font-dialog-head">
        <strong id="info-title"></strong>
        <button class="icon-btn" value="cancel" data-i18n-title="close" aria-label=""><svg class="icon"><use href="#i-x" /></svg></button>
      </form>
      <div class="info-body" id="info-body"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
